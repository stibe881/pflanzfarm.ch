<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pflanzfarm</title>
    <script>
      (function () {
        var base = '/pflanzfarm.ch'
        var path = window.location.pathname
        var route = path.indexOf(base + '/') === 0 ? path.slice(base.length) : '/'
        var target = base + '/?p=' + encodeURIComponent(route + window.location.search) + window.location.hash
        window.location.replace(target)
      })()
    </script>
  </head>
  <body></body>
</html>
